<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour Rüced ❤️</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .heart-container {
      text-align: center;
      z-index: 2;
    }

    /* Style CSS inspiré de la vidéo */
    .Love_You {
      position: relative;
      font-size: 3rem;
      color: #ffb6c1;
      text-shadow: 0 0 20px #ff477e, 0 0 40px #ff477e;
      animation: pulse 1.5s infinite alternate;
    }

    .name {
      margin-top: 15px;
      font-size: 2rem;
      color: #ffffff;
      font-style: italic;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.08); filter: brightness(1.3); }
    }
  </style>
</head>
<body>

  <!-- Toile pour l'effet de particules -->
  <canvas id="particleCanvas"></canvas>

  <div class="heart-container">
    <div class="Love_You">❤️</div>
    <div class="name">Rüced</div>
  </div>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3 + 1,
        speedX: (Math.random() - 0.5) * 1.5,
        speedY: (Math.random() - 0.5) * 1.5,
        color: Math.random() > 0.5 ? '#ff477e' : '#ffd93d'
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
<!-- end -->
